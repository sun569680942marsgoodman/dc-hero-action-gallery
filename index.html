    let active = 'all';
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const segments = document.getElementById('segments');
    const countline = document.getElementById('countline');
    const empty = document.getElementById('empty');

    function itemMatches(item) {
      const q = search.value.trim().toLowerCase();
      const catOk = active === 'all' || item.category === active;
      if (!catOk) return false;
      if (!q) return true;
      return [item.title, item.hero, item.sourceName, item.category, item.type, ...(item.tags || [])].join(' ').toLowerCase().includes(q);
    }
    function mediaUrl(item) { return item.img || item.thumb; }
    function typeLabel(item) { return item.type === 'video' ? 'VIDEO' : item.type === 'gif' ? 'GIF' : 'IMG'; }
    function renderSegments() {
      const countFor = key => key === 'all' ? ITEMS.length : ITEMS.filter(x => x.category === key).length;
      segments.innerHTML = order.map(key => '<button class="seg ' + (active === key ? 'active' : '') + '" data-key="' + key + '">' + labels[key] + ' ' + countFor(key) + '</button>').join('');
    }
    function render() {
      renderSegments();
      const rows = ITEMS.filter(itemMatches);
      countline.textContent = rows.length + ' / ' + ITEMS.length + ' ???';
      empty.style.display = rows.length ? 'none' : 'block';
      grid.innerHTML = rows.map(item => {
        const img = mediaUrl(item);
        const tags = [item.hero, item.sourceName, ...(item.tags || [])].filter(Boolean).slice(0, 5);
        return '<article class="card" data-type="' + item.type + '">' +
          '<a class="media" href="' + esc(item.source) + '" target="_blank" rel="noopener noreferrer">' +

          '</a>' +
          '<div class="body">' +
            '<p class="title">' + esc(item.title) + '</p>' +
            '<div class="meta">' + tags.map(tag => '<span class="chip">' + esc(tag) + '</span>').join('') + '</div>' +
            '<div class="links"><a href="' + esc(item.source) + '" target="_blank" rel="noopener noreferrer">??</a><a href="' + esc(img) + '" target="_blank" rel="noopener noreferrer">???</a></div>' +

        '</article>';

    });
